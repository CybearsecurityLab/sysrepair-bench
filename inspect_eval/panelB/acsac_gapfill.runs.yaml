# ACSAC gap-fill: scenarios that never produced a scored episode.
#
# GENERATED by scratchpad/make_gapfill.py from the logs. Do not hand-edit:
# regenerate instead, because the gap set changes as legs land.
#
# `scenarios:` entries are ON-DISK paths, which is what run.py resolves;
# the log's scenario_id is a different string and will not match.
#
# Budgets are copied from acsac_full.runs.yaml VERBATIM. A gap-fill run at a
# different budget produces cells that cannot be pooled with the main leg.
#
# meta4/ad-vm is NOT listed: Windows AD targets do not run on this host.
defaults:
  seeds: [5]
  epochs: 1
  modes: [day1, zero_day]
  fail_on_error: 0.95
  retry_on_error: 1
  bash_timeout: 180
  verify_timeout: 360
  message_limit: 0
  token_limit: 0
  # Present in the original cell headers; set explicitly so the fill matches
  # the parent cell on every task key rather than relying on defaults.
  request_limit: 0
  request_window: 18000
  time_limit: 7200
  working_limit: 5400
  hang_kill_seconds: 21600
  preflight: true
  model_max_retries: 5
  model_timeout: 300
  model_attempt_timeout: 300
  model_client_timeout: 360
presets:
  acsac_gap_m2_d1:
    model: openai/MiniMax-M2.7
    base_url: https://api.minimax.io/v1
    api_key: ${MINIMAX_API_KEY_2}
    solvers: [react]
    modes: [day1]
    max_connections: 4
    scenarios:
      - meta4/scenario-06
      - meta4/scenario-29
      - meta4/scenario-37
      - meta4/scenario-38
      - meta4/scenario-44
      - meta4/scenario-51
