# Re-validate meta4/scenario-36 and -103 after the seeding fix (2026-09-24).
#
# Both used to pass a no-op: s36 seeded its public bucket at boot and could lose
# the race to an early submit; s103 started cups-browsed after `sleep 2` and an
# early submit graded before the daemon existed. s36 now bakes the vulnerable
# state into the image; s103 writes /run/sysrepair-boot-done once cups-browsed is
# up and verify.sh waits for it. Expected: no-op 0 joint (security fail),
# service-killer 0 joint, probe-blocker 0 joint, on every epoch.
#
# Scripted solvers: no endpoint is called and nothing is metered.
defaults:
  seeds: [1]
  epochs: 3
  log_dir: ./logs-validity
  bash_timeout: 240
  verify_timeout: 360
  fail_on_error: 1.0
  retry_on_error: 0
  time_limit: 1800
  working_limit: 1200
  message_limit: 0
  token_limit: 0
  preflight: false
presets:
  validity_na2_fixed:
    model: openai/Qwen/Qwen3.5-27B
    base_url: http://localhost:8100/v1
    api_key: vllm
    scenarios: [meta4/scenario-36, meta4/scenario-103]
    solvers: [noop, service-killer, probe-blocker]
    seeds: 1
    epochs: 3
    max_connections: 2
    modes: [day1]
