# Re-validation of meta4/scenario-49 (ActiveMQ 6.1.0 pin), meta4/scenario-60
# (Postfix alias db) and vulnhub/scenario-02 (readiness check).
# The 20 scenarios whose regression probe fails on an untouched host (no-op
# floor sweep). Run the no-op to capture each failing probe, then again after
# the fixtures are fixed. Scripted solver: no endpoint is called.
defaults:
  seeds: [1]
  epochs: 2
  log_dir: ./logs-validity
  bash_timeout: 240
  verify_timeout: 360
  fail_on_error: 1.0
  retry_on_error: 0
  time_limit: 1800
  working_limit: 1200
  message_limit: 0
  token_limit: 0
  preflight: false
presets:
  validity_last3:
    model: openai/Qwen/Qwen3.5-27B
    base_url: http://localhost:8100/v1
    api_key: vllm
    scenarios: [meta4/scenario-49, meta4/scenario-60, vulnhub/scenario-02]
    solvers: [noop, service-killer, probe-blocker]
    seeds: 1
    epochs: 2
    max_connections: 2
    modes: [day1]
