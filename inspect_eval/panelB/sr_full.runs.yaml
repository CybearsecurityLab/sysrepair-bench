# SysRepair-2026 ARTIFACT RERUN -- full grid, one epoch.
#
# seeds:[5] means max_attempts=5, and pass@1..5 is reconstructed from the five
# submit attempts WITHIN each episode: every solver emits k-1 intermediate
# ScoreEvents plus the end-of-sample score (verified across react, basic,
# reflexion and plan_and_solve on 2026-09-06). So ONE epoch here is a
# complete pass@1..5 curve, not a fifth of one. Run epoch 2 only after the whole
# grid has one epoch, so a full result set always exists.
#
# meta3/windows is NOT here: Windows containers only run on the peer's machine,
# one docker engine mode at a time.
# hivestorm is zero_day only (no per-scenario briefing) and react only, matching
# tab:hivestorm.
#
# MiniMax uses KEY 2. The forked ICLR session holds key 1 for its M3 leg; four
# parallel agents per key, so neither rate-limits the other.
defaults:
  seeds: [5]
  epochs: 1
  modes: [day1, zero_day]
  fail_on_error: 0.95
  retry_on_error: 1
  bash_timeout: 180
  verify_timeout: 360
  message_limit: 0
  token_limit: 0
  # BUDGET, and it is a correctness setting rather than a throughput knob.
  # Measured on the Windows cell: black-box working time has median 1189s and
  # p90 3766s, against a 2400s cap. That cap truncated ~40% of black-box
  # episodes, and every truncated episode was scored a FAILURE -- so a fixed
  # budget converts the measured 9.47x cost of black-box directly into an
  # apparent capability gap. 1800s would have been worse.
  #
  # 5400s sits above the observed p90 so truncation stops being the dominant
  # failure mode, and it is UNIFORM across every cell here: unequal budgets
  # across cells make cross-cell accuracy comparisons meaningless, which is the
  # state the older presets are in (1200 / 1800 / 2400 in the same repo).
  time_limit: 7200
  working_limit: 5400
  hang_kill_seconds: 21600
  preflight: true
  model_max_retries: 5
  model_timeout: 300
  model_attempt_timeout: 300
  model_client_timeout: 360
presets:
  # ---- smoke: validates the whole path before we commit days of compute ----
  sr_smoke_m2:
    model: openai/MiniMax-M2.7
    base_url: https://api.minimax.io/v1
    api_key: ${MINIMAX_API_KEY_2}
    benchmarks: [ccdc]
    scenarios: [ccdc/scenario-01, ccdc/scenario-02]
    solvers: [react]
    modes: [day1]
    max_connections: 2
    request_limit: 15000
    request_window: 18000

  # ---- MiniMax-M2.7, key 2, no GPU needed ----
  sr_m2_full:
    model: openai/MiniMax-M2.7
    base_url: https://api.minimax.io/v1
    api_key: ${MINIMAX_API_KEY_2}
    benchmarks: [ccdc, meta2, meta3/ubuntu, vulnhub, meta4, meta4/ad-vm]
    solvers: [react, basic, reflexion, plan_and_solve]
    max_connections: 4
    request_limit: 15000
    request_window: 18000

  sr_m2_hivestorm:
    model: openai/MiniMax-M2.7
    base_url: https://api.minimax.io/v1
    api_key: ${MINIMAX_API_KEY_2}
    benchmarks: [hivestorm]
    solvers: [react]
    modes: [zero_day]
    max_connections: 4
    request_limit: 15000
    request_window: 18000

  # ---- Qwen models, served on Delta and tunnelled to :8001 ----
  # 9B is HALF the SysRepair paper (the other model is MiniMax-M2.7; 35B is not in
  # tab:headline). Served locally on the 2xL40 at :8100.
  #
  # vulnhub is included even though the peer holds partial 9B/vulnhub cells:
  # running it here keeps the whole suite on ONE machine, ONE probe version and
  # ONE budget, instead of merging their 27+16 episodes with 19 of mine across
  # machines. Their cells become an independent cross-check rather than a
  # dependency, which is worth more than the saved compute.
  #
  # Reportable solvers first. reflexion is the one most exposed to connection
  # attrition (the peer measured 14 of 30 episodes lost in one cell, against 0
  # for react), so retry handling matters most there.
  sr_9b_full:
    model: openai/Qwen/Qwen3.5-9B
    base_url: http://localhost:8100/v1
    api_key: vllm
    benchmarks: [ccdc, meta2, meta3/ubuntu, vulnhub, meta4, meta4/ad-vm]
    solvers: [react, reflexion, basic]
    max_connections: 8

  # The peer already holds qwen35b on ccdc+vulnhub (80 scenarios, all 5 solvers,
  # both conditions). Run only the suites it does not hold, so we do not reburn
  # 800 banked episodes.
  sr_35b_full:
    model: openai/Qwen/Qwen3.5-35B-A3B
    base_url: http://localhost:8100/v1
    api_key: vllm
    benchmarks: [meta2, meta3/ubuntu, meta4, meta4/ad-vm]
    solvers: [react, basic, reflexion, plan_and_solve]
    max_connections: 8
