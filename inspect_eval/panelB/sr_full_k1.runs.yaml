# SysRepair M2.7 on API KEY 1.
#
# The preset name is DELIBERATELY identical to the one in sr_full.runs.yaml.
# run.py derives the eval_set dir as ./logs_es/{preset}_{solver}_{mode}_k{k},
# so sharing the name makes both keys write into the SAME eval_set namespace.
# That is what lets key 2, when it eventually reaches plan_and_solve in its
# own solver list, see them already complete and skip them instead of redoing
# ~550 episodes.
#
# SAFETY: the two keys MUST hold DISJOINT solver lists. Same-name + same-solver
# would put two processes in one eval_set dir concurrently. Key 2 currently owns
# [react, basic, reflexion]; this file owns [plan_and_solve] only.
#
# Every budget key below is copied verbatim from sr_full.runs.yaml. Unequal
# budgets across cells make cross-cell accuracy comparisons meaningless, and
# tab:headline compares these cells directly.
defaults:
  seeds: [5]
  epochs: 1
  modes: [day1, zero_day]
  fail_on_error: 0.95
  retry_on_error: 1
  bash_timeout: 180
  verify_timeout: 360
  message_limit: 0
  token_limit: 0
  time_limit: 7200
  working_limit: 5400
  hang_kill_seconds: 21600
  preflight: true
  model_max_retries: 5
  model_timeout: 300
  model_attempt_timeout: 300
  model_client_timeout: 360
presets:
  sr_m2_full:
    model: openai/MiniMax-M2.7
    base_url: https://api.minimax.io/v1
    api_key: ${MINIMAX_API_KEY}
    benchmarks: [ccdc, meta2, meta3/ubuntu, vulnhub, meta4, meta4/ad-vm]
    solvers: [plan_and_solve]
    max_connections: 4
    request_limit: 15000
    request_window: 18000
